<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SHAWSEEN MAAZIM | Digital Menu</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5efe4;
      color: #173246;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px 15px 45px;
    }

    .logo {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-top: 10px;
    }

    .tagline {
      font-size: 14px;
      letter-spacing: 2px;
      margin-top: 8px;
      margin-bottom: 25px;
      color: #9b5034;
      font-weight: bold;
    }

    .menu {
      width: 100%;
      height: 75vh;
      min-height: 550px;
      border: none;
      border-radius: 16px;
      background: white;
      box-shadow: 0 5px 25px rgba(0,0,0,0.15);
    }

    .button {
      display: inline-block;
      margin-top: 18px;
      padding: 14px 25px;
      background: #9b5034;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      font-size: 16px;
    }

    .info {
      margin-top: 22px;
      line-height: 1.8;
      font-size: 14px;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      opacity: 0.7;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 26px;
      }

      .menu {
        height: 70vh;
        min-height: 500px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      SHAWSEEN MAAZIM
    </div>

    <div class="tagline">
      AUTHENTIC TUNISIAN CUISINE • SINCE 1996
    </div>

    <iframe
      class="menu"
      src="Menu.pdf"
      title="SHAWSEEN MAAZIM Digital Menu">
    </iframe>

    <br>

    <a
      class="button"
      href="Menu.pdf"
      target="_blank">
      OPEN FULL MENU
    </a>

    <div class="info">
      📍 Al Khaima Building, behind Nissan Show Room
      <br>
      📞 0565925041 | 042657655
    </div>

    <div class="footer">
      Thank you for dining with us ❤️
    </div>

  </div>

</body>
</html>
